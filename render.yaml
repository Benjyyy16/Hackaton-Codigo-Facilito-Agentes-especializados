services:
  - type: web
    name: Hackaton-Front
    env: node
    branch: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: ./dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: NODE_VERSION
        value: 18
      - key: VITE_BACKEND_URL
        sync: false
